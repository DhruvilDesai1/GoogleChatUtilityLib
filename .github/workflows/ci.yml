name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  # Recovery path: attach chatnotify.pyz to a tag whose release job failed, without
  # having to delete and re-publish the release (re-running a failed run would reuse
  # the old workflow file, bug included).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach chatnotify.pyz to (e.g. v2.0.1)"
        required: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -v

  zipapp:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build single-file zipapp
        run: |
          python -m zipapp src -m "chatnotify.cli:entrypoint" -p "/usr/bin/env python3" -o chatnotify.pyz
          python chatnotify.pyz --version
      - uses: actions/upload-artifact@v4
        with:
          name: chatnotify-pyz
          path: chatnotify.pyz

  release-pyz:
    if: >
      (github.event_name == 'release' && github.event.action == 'published')
      || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build single-file zipapp
        run: python -m zipapp src -m "chatnotify.cli:entrypoint" -p "/usr/bin/env python3" -o chatnotify.pyz
      - name: Verify the artifact reports the version the tag claims
        # Compared against the tag, never a literal: a hardcoded expected version
        # silently fails the release on the next bump, which is exactly what happened
        # to v2.0.1. This also catches a tag pointing at the wrong commit.
        run: |
          expected="${TAG#v}"
          actual="$(python chatnotify.pyz --version)"
          echo "tag=$TAG  expected=$expected  actual=$actual"
          test "$actual" = "$expected"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" chatnotify.pyz --clobber

  # The only check that can catch a payload the live API rejects. The test suite
  # posts to a stub that accepts any JSON, so it validates transport and never
  # schema - which is how v2.0.0 shipped a card field Chat refuses.
  smoke-chat:
    if: >
      (github.event_name == 'release' && github.event.action == 'published')
      || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      # The harness is CI infrastructure and lives on the default branch, NOT at the
      # tag - an older tag predates it. The package under test comes from the tag
      # instead, installed the way a user installs it. Checking out the tag here is
      # what broke the first run of this job.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the released version from its tag
        run: pip install "git+https://github.com/${{ github.repository }}@$TAG"
      - name: Confirm the installed version matches the tag
        run: |
          expected="${TAG#v}"
          actual="$(python -c 'import chatnotify; print(chatnotify.__version__)')"
          echo "tag=$TAG  expected=$expected  installed=$actual"
          test "$actual" = "$expected"
      - name: Require Google Chat to accept every card shape
        env:
          WEBHOOK: ${{ secrets.CHATNOTIFY_SMOKE_WEBHOOK }}
        run: python .github/scripts/smoke_chat.py
