name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -v

  zipapp:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build single-file zipapp
        run: |
          python -m zipapp src -m "chatnotify.cli:entrypoint" -p "/usr/bin/env python3" -o chatnotify.pyz
          python chatnotify.pyz --version
      - uses: actions/upload-artifact@v4
        with:
          name: chatnotify-pyz
          path: chatnotify.pyz

  release-pyz:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build single-file zipapp
        run: python -m zipapp src -m "chatnotify.cli:entrypoint" -p "/usr/bin/env python3" -o chatnotify.pyz
      - name: Verify zipapp runs
        run: |
          version="$(python chatnotify.pyz --version)"
          echo "chatnotify.pyz --version -> $version"
          test "$version" = "2.0.0"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" chatnotify.pyz --clobber
